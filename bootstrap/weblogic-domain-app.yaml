apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: weblogic-sample-domain
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/amitpandey1992/wko-gitops-infra.git
    targetRevision: main
    path: domains/sample-domain
  destination:
    server: https://kubernetes.default.svc
    namespace: weblogic-domains
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
