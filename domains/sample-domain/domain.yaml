# ==============================================================================
# Oracle WebLogic Domain Custom Resource - WKO v4.2.x (API v9)
# ==============================================================================
apiVersion: "weblogic.oracle/v9"
kind: Domain
metadata:
  name: sample-domain
  namespace: weblogic-domains
  labels:
    weblogic.domainUID: sample-domain
spec:
  domainUID: sample-domain
  domainHome: /u01/domains/sample-domain
  domainHomeSourceType: Image
  image: "container-registry.oracle.com/middleware/weblogic:12.2.1.4"
  imagePullPolicy: IfNotPresent

  # Correct field name for WKO v4.x (capital L in webLogic)
  webLogicCredentialsSecret:
    name: weblogic-credentials

  includeServerOutInPodLog: true
  serverStartPolicy: IfNeeded

  # Global server pod configuration
  serverPod:
    env:
      - name: JAVA_OPTIONS
        value: "-Dweblogic.StdoutDebugEnabled=false"
      - name: USER_MEM_ARGS
        value: "-Djava.security.egd=file:/dev/./urandom -Xms256m -Xmx512m"
    resources:
      requests:
        cpu: "250m"
        memory: "768Mi"
      limits:
        cpu: "1000m"
        memory: "1024Mi"

  # Admin Server Configuration
  adminServer:
    adminChannelPortForwardingEnabled: true

  # Cluster references (WKO v4.x uses separate Cluster CRD)
  clusters:
    - name: sample-domain-cluster-1

  replicas: 1
