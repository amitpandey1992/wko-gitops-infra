# ==============================================================================
# Enterprise SecretStore Definitions for External Secrets Operator (ESO)
# Supports both: Akeyless Vault & Google Cloud Secret Manager (GCP SM)
# ==============================================================================

# Option 1: Akeyless SecretStore (Used in Enterprise Production environments)
# To use Akeyless: Create an API Key in Akeyless and store its Access ID & Key in k8s secret
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: akeyless-secret-store
  namespace: weblogic-domains
spec:
  provider:
    akeyless:
      akeylessGWApiURL: "https://api.akeyless.io"
      auth:
        secretRef:
          accessId:
            name: akeyless-creds
            key: access-id
          accessType:
            name: akeyless-creds
            key: access-type # api_key
          accessTypeParam:
            name: akeyless-creds
            key: access-key

# Option 2: GCP Secret Manager SecretStore (Used natively in Google Cloud GKE)
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: gcp-secret-store
  namespace: weblogic-domains
spec:
  provider:
    gcpsm:
      projectID: project-616fef18-15b8-4d6c-8a2
