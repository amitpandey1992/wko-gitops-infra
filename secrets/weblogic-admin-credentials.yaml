# ==============================================================================
# ExternalSecret: Pulls credentials from External Vault (Akeyless or GCP SM)
# and generates a native Kubernetes Secret for WebLogic Server Domain
# ==============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: weblogic-credentials-external
  namespace: weblogic-domains
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store # Switch to 'akeyless-secret-store' for Akeyless
    kind: SecretStore
  target:
    name: weblogic-credentials # Name of the generated Kubernetes Secret
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          weblogic.domainUID: sample-domain
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: weblogic-admin-user
    - secretKey: password
      remoteRef:
        key: weblogic-admin-password
